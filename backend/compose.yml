services:
  postgres:
    image: 'postgres:17.6'
    container_name: food_app_postgresql
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - food_app_network

networks:
  food_app_network:
    driver: bridge

volumes:
  postgres-data:
    driver: local